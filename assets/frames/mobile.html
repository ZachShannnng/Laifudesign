<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Frame</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
    }
    .iphone-frame {
      width: 375px;
      height: 812px;
      background: #000;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .screen {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
    }
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 30px;
      background: #000;
      border-radius: 0 0 20px 20px;
    }
    .content {
      padding: 44px 16px 16px;
      height: 100%;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="iphone-frame">
    <div class="screen">
      <div class="notch"></div>
      <div class="content" id="frame-content">
        <!-- 内容将在这里注入 -->
      </div>
    </div>
  </div>
  <script>
    // 接收父窗口传递的 HTML 内容
    window.addEventListener('message', (e) => {
      if (e.data.html) {
        document.getElementById('frame-content').innerHTML = e.data.html;
      }
    });
  </script>
</body>
</html>
